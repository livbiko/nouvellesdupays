# Throwaway test run for branch feat/africa-voices-data-cleanup.
# Own namespace + own Postgres: never touches production data.
apiVersion: v1
kind: Namespace
metadata: { name: ndp-ci }
---
apiVersion: v1
kind: Pod
metadata: { name: ndp-api-tests, namespace: ndp-ci }
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 1500
  containers:
  - name: postgres
    image: docker.io/library/postgres:16
    env:
    - { name: POSTGRES_USER, value: nouvellesdupays }
    - { name: POSTGRES_PASSWORD, value: changeme }
    - { name: POSTGRES_DB, value: nouvellesdupays_test }
    resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }
  - name: tests
    image: docker.io/library/node:22
    resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 1536Mi } }
    command: ["bash", "-c"]
    args:
    - |
      set -e
      git clone -q --depth 1 -b feat/africa-voices-data-cleanup https://github.com/livbiko/nouvellesdupays.git /src && cd /src
      git log --oneline -1
      for i in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/5432) 2>/dev/null && break; sleep 2; done; sleep 3
      npm ci --no-audit --no-fund --loglevel=error
      export DATABASE_URL=postgres://nouvellesdupays:changeme@127.0.0.1:5432/nouvellesdupays_test
      node db/migrate.js > /tmp/migrate.log 2>&1 || { cat /tmp/migrate.log; exit 1; }
      cd apps/api
      set +e
      npm test > /tmp/test.log 2>&1; rc=$?
      grep -E "^not ok|^# (tests|pass|fail)" /tmp/test.log
      [ $rc -ne 0 ] && tail -80 /tmp/test.log
      echo "TESTS EXIT CODE: $rc"
      exit $rc
