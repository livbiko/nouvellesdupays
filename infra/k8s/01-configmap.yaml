# Non-sensitive RUNTIME config only. DATABASE_URL (contains the Postgres
# password) goes in 02-secret.yaml instead, created via 02-create-secret.ps1
# -- same split tekeche-api uses (see ops/k8s/tekeche-api/01-configmap.yaml /
# 02-create-secret.ps1 in the tekeche repo).
#
# NEXT_PUBLIC_API_URL is deliberately NOT here: Next.js inlines
# NEXT_PUBLIC_* vars into the client bundle at BUILD time, so it has to be
# passed as a Docker build-arg to the web image (see apps/web/Dockerfile
# and the Kaniko build job), not as a running-pod env var -- setting it
# here would have no effect on the already-built static JS.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nouvellesdupays-config
  namespace: nouvellesdupays
data:
  PORT: "4000"
  NODE_ENV: "production"
  POLL_SCHEDULE: "*/5 * * * *"
  POSTGRES_USER: "nouvellesdupays"
  POSTGRES_DB: "nouvellesdupays"
  # --- Analytics / Meta tracking (see docs/ANALYTICS-TRACKING.md) ---------
  # Non-secret defaults; an admin can override most of these at runtime in
  # /admin/settings. The Meta Pixel ID is public by nature (it is visible in
  # every visitor's browser). META_ACCESS_TOKEN is a SECRET -> 02-create-secret.ps1.
  TRACKING_ENABLED: "true"
  CONSENT_MODE: "opt_in"
  META_PIXEL_ID: "2488060141701903"
  META_GRAPH_API_VERSION: "v21.0"
  PUBLIC_SITE_URL: "https://nouvellesdupays.com"
  # Feed-less source crawler (worker): bounded, robots.txt-compliant.
  CRAWL_MAX_ARTICLES_PER_RUN: "20"
  CRAWL_DELAY_MS: "1000"
