  namespace: nouvellesdupays
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1200
      backoffLimit: 1
      template:
        spec:
          containers:
          - command:
            - node
            - apps/worker/src/youtube-audience-once.js
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: DATABASE_URL
                  name: nouvellesdupays-secrets
            - name: YOUTUBE_API_KEY
              valueFrom:
                secretKeyRef:
                  key: YOUTUBE_API_KEY
