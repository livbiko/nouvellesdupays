# Nightly image rebuild for the on-prem mirror, same source (git main) and
# Dockerfiles as the OKE kaniko-build-*.yaml jobs, but pushed to dr-rke2's
# own in-cluster registry (192.168.1.51:30500, anonymous/insecure HTTP --
# hence --insecure and no docker-config secret, unlike the OCIR-targeted
# builds) instead of OCIR. Three separate CronJobs, staggered nightly,
# rather than one job doing everything: this single-node 2 vCPU box is
# genuinely CPU-starved -- `kubectl describe node` showed 94% of CPU
# *requests* already committed (1885m/2000m) by the six standby mirror
# namespaces already running here, a big jump from the 8.5% the 2026-09-04
# audit recorded, so there's only ~115m of schedulable headroom at any
# given moment. A first attempt at 200m CPU request for the kaniko pod hit
# `Insufficient cpu` and sat Pending indefinitely -- these jobs request the
# bare minimum (50m) instead and rely on the CPU *limit* alone to throttle
# them, accepting a slower build rather than fighting the other mirrors
# for scheduling room. Don't raise these requests without first freeing up
# headroom elsewhere (or growing the VM's vCPU allocation, which needs its
# own ESXi-host-capacity check first).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dr-image-sync-api
  namespace: nouvellesdupays
spec:
  schedule: "10 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: kaniko
              image: gcr.io/kaniko-project/executor@sha256:4e7a52dd1f14872430652bb3b027405b8dfd17c4538751c620ac005741ef9698  # pinned CR-2026-11-25-02 (was :latest)
              args:
                - "--context=git://github.com/livbiko/nouvellesdupays.git#refs/heads/main"
                - "--dockerfile=apps/api/Dockerfile"
                - "--destination=192.168.1.51:30500/nouvellesdupays-api:local"
                - "--insecure"
                - "--skip-tls-verify"
              resources:
                requests:
                  cpu: "50m"
                  memory: "512Mi"
                limits:
                  cpu: "1000m"
                  memory: "1Gi"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dr-image-sync-web
  namespace: nouvellesdupays
spec:
  # 04:25 (CR-2026-11-25-02): api/worker builds are done by then, nothing overlaps the heavy web build.
  schedule: "25 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      # Next.js build (npm install + next build) is the heaviest step in
      # either image -- generous deadline given the low CPU request below
      # (see the CronJob-level comment on why it's 50m, not 200m).
      activeDeadlineSeconds: 2400
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: kaniko
              image: gcr.io/kaniko-project/executor@sha256:4e7a52dd1f14872430652bb3b027405b8dfd17c4538751c620ac005741ef9698  # pinned CR-2026-11-25-02 (was :latest)
              args:
                - "--context=git://github.com/livbiko/nouvellesdupays.git#refs/heads/main"
                - "--context-sub-path=apps/web"
                - "--dockerfile=Dockerfile"
                - "--build-arg=NEXT_PUBLIC_API_URL=https://nouvellesdupays.com"
                - "--destination=192.168.1.51:30500/nouvellesdupays-web:local"
                - "--insecure"
                - "--skip-tls-verify"
                # Less disk/memory churn for etcd on the same disk (CR-2026-11-25-02).
                - "--snapshot-mode=redo"
                - "--compressed-caching=false"
              resources:
                requests:
                  cpu: "50m"
                  memory: "768Mi"
                # 1Gi OOMKilled the pod mid-build (kaniko's own filesystem
                # snapshot step after `npm ci` populates node_modules, not
                # even next build itself) -- node has ~2.3GB free at 60%
                # used, so 2Gi has real headroom without starving the other
                # standby mirrors sharing this box.
                # CPU 1000m -> 500m (CR-2026-11-25-02): the 11-20 etcd freeze began during this build.
                limits:
                  cpu: "500m"
                  memory: "2Gi"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dr-image-rollout
  namespace: nouvellesdupays
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dr-image-rollout
  namespace: nouvellesdupays
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dr-image-rollout
  namespace: nouvellesdupays
subjects:
  - kind: ServiceAccount
    name: dr-image-rollout
    namespace: nouvellesdupays
roleRef:
  kind: Role
  name: dr-image-rollout
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dr-image-rollout
  namespace: nouvellesdupays
spec:
  # 20 minutes after the web build starts -- comfortable margin for both
  # kaniko builds to have finished and pushed before forcing a re-pull.
  # 05:00 (CR-2026-11-25-02): the gentler web build can take ~20 min.
  schedule: "0 5 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        spec:
          serviceAccountName: dr-image-rollout
          restartPolicy: Never
          containers:
            - name: rollout
              image: registry.k8s.io/kubectl:v1.35.7
              command:
                - kubectl
                - rollout
                - restart
                - deployment/nouvellesdupays-api
                - deployment/nouvellesdupays-web
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"
