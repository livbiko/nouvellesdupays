apiVersion: apps/v1
kind: Deployment
metadata:
  name: nouvellesdupays-api
  namespace: nouvellesdupays
  labels:
    app: nouvellesdupays-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nouvellesdupays-api
  template:
    metadata:
      labels:
        app: nouvellesdupays-api
    spec:
      imagePullSecrets:
        - name: ocir-pull-secret
      containers:
        - name: api
          image: lhr.ocir.io/lr14abpkfrxj/nouvellesdupays-api:latest
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: nouvellesdupays-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nouvellesdupays-secrets
                  key: DATABASE_URL
            - name: ADMIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: nouvellesdupays-secrets
                  key: ADMIN_PASSWORD_HASH
            - name: ADMIN_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: nouvellesdupays-secrets
                  key: ADMIN_TOKEN_SECRET
            # Optional: the API starts without them (Meta CAPI is then
            # "disabled" and YouTube metadata falls back to keyless oEmbed).
            - name: META_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nouvellesdupays-secrets
                  key: META_ACCESS_TOKEN
                  optional: true
            - name: META_TEST_EVENT_CODE
              valueFrom:
                secretKeyRef:
                  name: nouvellesdupays-secrets
                  key: META_TEST_EVENT_CODE
                  optional: true
            - name: YOUTUBE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nouvellesdupays-secrets
                  key: YOUTUBE_API_KEY
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: nouvellesdupays-api
  namespace: nouvellesdupays
spec:
  type: ClusterIP
  selector:
    app: nouvellesdupays-api
  ports:
    - port: 4000
      targetPort: 4000
